<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מצגת</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .15s; }
  img.on { opacity:1; }
</style>
</head>
<body>
<img id="a"><img id="b">
<script>
  // התוכנה בכיתה קוראת ל-show(deck, slide, total) כשהמורה מדפדף. שתי תמונות מתחלפות, כדי שלא יהבהב.
  var cur = 'a', cache = {};
  function url(d, n) { return encodeURIComponent(d) + '/' + n + '.webp'; }
  function pre(d, n, total) { for (var i = n + 1; i <= Math.min(total, n + 3); i++) if (!cache[d + i]) { cache[d + i] = new Image(); cache[d + i].src = url(d, i); } }
  function show(d, n, total) {
    var next = cur === 'a' ? 'b' : 'a', img = document.getElementById(next);
    img.onload = function () { img.classList.add('on'); document.getElementById(cur).classList.remove('on'); cur = next; };
    img.src = url(d, n);
    pre(d, n, total || n);
  }
  function fromHash() {
    var h = location.hash.slice(1).split('/');
    if (h[0]) show(decodeURIComponent(h[0]), Number(h[1]) || 1, Number(h[2]) || 1);
  }
  window.addEventListener('hashchange', fromHash);
  fromHash();
</script>
</body>
</html>
